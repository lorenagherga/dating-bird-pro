name: Android Build (APK)

on:
  workflow_dispatch:

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_NO_TELEMETRY: "1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          echo "=== Installed platforms ==="
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          echo "=== Installed build-tools ==="
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"

      - name: Install npm dependencies
        run: npm ci

      - name: Create .env for build
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "=== .env created ==="
          cat .env | head -1
          echo "(key hidden)"

      - name: Run expo prebuild
        id: prebuild
        run: |
          echo "=== STARTING expo prebuild ==="
          npx expo prebuild --platform android --clean 2>&1 || echo "PREBUILD FAILED with code $?"
          echo "=== prebuild done ==="
        continue-on-error: true

      - name: Check android dir state
        run: |
          echo "=== android/ exists? ==="
          ls -la android/ 2>/dev/null || echo "NO android/ dir"
          echo "=== gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "NO wrapper"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          echo "=== Gradle build starting ==="
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace 2>&1
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Copy APK to output
        if: success()
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/DatingBirdPro-v1.0.1.apk
          ls -lh output/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DatingBirdPro-APK
          path: output/*.apk
          retention-days: 30
