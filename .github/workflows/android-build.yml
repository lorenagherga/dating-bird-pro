name: Android Build (Direct Gradle)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Diagnostics & Prebuild
        run: |
          echo "--- Android App Dir Check ---"
          ls -la android/app/ 2>/dev/null || echo "No android/app dir"
          echo "--- Gradle Wrapper Props ---"
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "No wrapper props"
          echo "--- Node Modules Exist? ---"
          ls node_modules/ | head -n 10 2>/dev/null || echo "No node_modules"
          echo "--- Package JSON Exist? ---"
          head -n 5 package.json 2>/dev/null || echo "No package.json"
          
          echo "--- Running Prebuild Now ---"
          npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check All APK Files
        if: always()
        run: |
          echo "--- Searching for generated APKs ---"
          find . -name "*.apk" 2>/dev/null || echo "No APK files found at all"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dating-Bird-Pro-APK
          path: android/app/build/outputs/apk/release/app-release.apk
