name: Android Build (APK)

on:
  workflow_dispatch:

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_NO_TELEMETRY: "1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Install npm dependencies
        run: |
          npm ci 2>&1
          echo "npm ci exit: $?"

      - name: Run expo prebuild
        id: prebuild
        run: |
          echo "=== STARTING expo prebuild ==="
          npx expo prebuild --platform android --clean 2>&1 || echo "PREBUILD FAILED with code $?"
          echo "=== prebuild done ==="
        continue-on-error: true

      - name: Check android dir state
        run: |
          echo "=== android/ exists? ==="
          ls -la android/ 2>/dev/null || echo "NO android/ dir"
          echo "=== android/app/ ==="
          ls -la android/app/ 2>/dev/null || echo "NO android/app/ dir"
          echo "=== gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "NO wrapper"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          echo "=== Gradle build starting ==="
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace 2>&1
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Copy APK to output
        if: success()
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/DatingBirdPro-v1.0.0.apk
          ls -lh output/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DatingBirdPro-APK
          path: output/*.apk
          retention-days: 30
